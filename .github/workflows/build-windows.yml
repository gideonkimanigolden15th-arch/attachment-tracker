name: Build Windows app

# Builds AttachmentTracker-Setup.exe (installer) and AttachmentTracker-portable.zip on GitHub's Windows machines.
# Run it by pushing a tag like v1.5.0 (it also creates the download page's release), or from the Actions tab -> Run workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(python -c "from attachment_tracker import __version__ as v; print(v)")" >> "$GITHUB_OUTPUT"

      - name: Run the tests (no window needed)
        run: python tests/smoke_test.py

      - name: Build the app
        run: python -m PyInstaller packaging/AttachmentTracker.spec --noconfirm

      - name: Check the built app works (database, snapshot, verify)
        shell: bash
        run: |
          export ATTACHMENT_TRACKER_HOME="$RUNNER_TEMP/check"
          python -c "from attachment_tracker import db; from attachment_tracker.config import get_paths; c=db.connect(get_paths().db); c.close()"
          ./dist/AttachmentTracker/AttachmentTracker.exe --prepare-backup
          ./dist/AttachmentTracker/AttachmentTracker.exe --verify

      - name: Make the installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" packaging\installer.iss

      - name: Make the portable zip
        run: Compress-Archive -Path dist\AttachmentTracker -DestinationPath dist\AttachmentTracker-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AttachmentTracker-windows
          path: |
            dist/AttachmentTracker-Setup.exe
            dist/AttachmentTracker-portable.zip

      - name: Publish a release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AttachmentTracker-Setup.exe
            dist/AttachmentTracker-portable.zip
